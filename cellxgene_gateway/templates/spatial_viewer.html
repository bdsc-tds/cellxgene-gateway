<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spatial viewer</title>
  <style>
    html,
    body,
    #root {
      margin: 0;
      height: 100%;
      width: 100%;
    }

    #message {
      font-family: sans-serif;
      padding: 1rem;
      color: #444;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="message">Loading spatial viewer…</div>
  </div>
  <!-- Self-hosted bundle built from spatial_viewer_src/ (no CDN at runtime).
    reads ?config= query parameter itself. -->
  <script type="module"
    src="{{ url_for('static', filename='vitessce/spatial-viewer.js') }}"></script>
</body>

</html>
